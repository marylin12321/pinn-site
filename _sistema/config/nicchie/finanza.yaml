# ============================================================
# NICCHIA: FINANZA PERSONALE — contenuti, prodotti, board, design
# - contenuti: pin di valore (generati sempre, anche senza link)
# - prodotti: tipo affiliate = link Amazon col tuo tag (SiteStripe, MAI shortener);
#   digitale/pod/email = tuoi (Etsy/Gumroad/landing) — da compilare quando pronti
# - handle: account Pinterest dedicato (firma sui pin) — nomi board IDENTICI su Pinterest
# ============================================================
