name: Sito giornaliero

# Pipeline quotidiana: gira sui server GitHub anche con il PC spento.
# Ricostruisce landing + guide + feed + sitemap dalle sorgenti (_sistema/) e
# pusha: le guide la cui data `pubblica_dal` è arrivata compaiono da sole,
# con la loro cover, e Pinterest le ritira via RSS entro 24h.
# API v5 (se configurata): dopo il build posta i pin della coda in automatico,
# anche a PC spento. Basta aggiungere i secret PINTEREST_TOKEN_* in
# Settings → Secrets and variables → Actions.
# Avvio: ogni giorno alle 08:15 (IT) + manuale dalla tab "Actions".
# Niente trigger su `push`: il build committa e pusha, quindi un `on: push`
# si auto-alimenterebbe all'infinito. L'unicoingresso esterno è il cron.

on:
  schedule:
    - cron: '15 6 * * *'   # 06:15 UTC = 08:15 Italia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # un solo run alla volta: se il run di ieri è ancora vivo, questo aspetta
  # invece di spingere due build in concorrenza sullo stesso branch
  group: quotidiana
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze di sistema
        # poppler-utils serve solo se in CI nasce un printable NUOVO (serve a
        # pdftoppm per l'anteprima). Quelli già esistenti vengono riutilizzati.
        # google-chrome è già nell'immagine del runner.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Dipendenze Python
        # pillow serve alle cover dei printable (1000x1500), pyyaml al build.
        run: pip install --quiet pyyaml pillow

      - name: Prepara l'albero di build
        # L'elenco di "cosa serve al build" sta in un posto solo,
        # _sistema/tools/prepara_ci.py, ed è lo stesso che usa
        # pubblica_immagini.py --verifica-ci prima di ogni push. Qui dentro
        # era una `cp` per riga: ogni modulo nuovo richiesto da un tool (sono
        # successi pendenze.py e poi url_base.py) mancava e la pipeline se ne
        # accorgeva solo di notte, con un run rosso.
        run: python3 _sistema/tools/prepara_ci.py --dest build

      - name: Pre-flight configurazione
        working-directory: build
        # Handle, board, link prodotto, hosting: le cose che, se si spostano,
        # non si vedono finché un pin non esce con il link sbagliato. Fallisce
        # solo sui bloccanti; gli avvisi si leggono nel log senza fermare nulla.
        # (Le foto di sfondo non sono in CI: il controllo le salta apposta.)
        run: python3 src/verifica.py

      - name: Build (landing + guide pubblicabili + feed + sitemap)
        working-directory: build
        run: python3 tools/build_sito.py --check

      - name: Copia l'output nella root e push
        run: |
          cp -r build/site/. .
          rm -rf build
          git config user.name "pinbot"
          git config user.email "pinbot@localhost"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessun cambiamento: niente commit."
            exit 0
          fi
          git commit -m "build automatico: $(date -u +%F) (guide, feed, sitemap)"
          git pull --rebase origin main
          git push

  postapi:
    # Posta i pin della coda via Pinterest API v5.
    #
    # NB: il contesto `secrets` NON esiste in un `if:` a livello di job (GitHub
    # rifiuta il file: "Unrecognized named-value: 'secrets'"). Va spostato a
    # livello di step, dove può leggere la `env` del job, che invece le vede.
    #
    # Se il token è solo read (Trial) il passo non deve far fallire il run:
    # aspetta lo scope pins:write (Standard access) e intanto l'RSS fa il suo lavoro.
    needs: build
    runs-on: ubuntu-latest
    env:
      PINTEREST_TOKEN_CASA: ${{ secrets.PINTEREST_TOKEN_CASA }}
      PINTEREST_TOKEN_CIBO: ${{ secrets.PINTEREST_TOKEN_CIBO }}
      PINTEREST_TOKEN_FINANZA: ${{ secrets.PINTEREST_TOKEN_FINANZA }}
      PINTEREST_TOKEN_PARENTING: ${{ secrets.PINTEREST_TOKEN_PARENTING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dipendenze
        run: pip install --quiet pyyaml

      - name: Posta pin in coda (API v5)
        if: >-
          ${{ env.PINTEREST_TOKEN_CASA != '' || env.PINTEREST_TOKEN_CIBO != ''
           || env.PINTEREST_TOKEN_FINANZA != '' || env.PINTEREST_TOKEN_PARENTING != '' }}
        run: |
          python3 _sistema/tools/pinterest_api.py --posta --tutte --max 1 || true
          git config user.name "pinbot"
          git config user.email "pinbot@localhost"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessun pin segnato: niente commit."
            exit 0
          fi
          git commit -m "api: marca guide pubblicate (pubblicato: YYYY-MM-DD)"
          git pull --rebase origin main
          git push
